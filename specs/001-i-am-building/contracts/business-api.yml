# Data Contract: Business Creation and Management via GunDB

## Overview
This document specifies the data interaction patterns for business creation and management functionality in the SuperSurkhet Super-Dapp/Super-Network Platform using GunDB and schema-driven development. Instead of traditional API endpoints, interactions happen directly with the GunDB decentralized database using the schema-based hooks system.

## Authentication
All data interactions require authentication via Google OAuth. Authentication context is managed at the GunDB level.

## Data Interaction Patterns

### useCreate (Create a new business profile on the platform)

#### Input
```typescript
{
  schema: "business",  // Defines which schema to use
  data: {
    name: "string, required, official business name",
    location: "string, physical address or area of the business (optional)",
    basePath: "string, unique URL path (e.g., /my-shop) (optional)",
    businessType: "string, required enum ('retail', 'food', 'service', 'education', 'healthcare', 'logistics', 'real_estate', 'cooperative', 'other', 'hotel', 'petrol_pump', 'gym', 'cinema', 'financial_firm', 'ride_sharing')",
    features: "record, map of enabled features (optional)",
    isActive: "boolean, default: true"
  }
}
```

#### Output
```typescript
{
  name: "string, business name",
  location: "string, business location",
  basePath: "string, unique URL path",
  businessType: "string, business category",
  features: "record, enabled features",
  isActive: "boolean, active status",
  created_by: "string, user ID of creator",
  timestamp: "number, unix timestamp of creation",
  offerings: "array, nested schema items/services offered by this business",
  _: { soul: "string, unique identifier generated by GunDB" }
}
```

### useGet (Retrieve a list of businesses, with optional filtering by type)

#### Input
```typescript
{
  schema: "business",  // Defines which schema to query
  filters: {
    businessType?: "string, filter businesses by type",
    isActive?: "boolean, filter by active status",
    sortBy?: "string, field to sort by (default: timestamp)",
    sortOrder?: "string, sort order ('asc' or 'desc')"
  },
  pagination: {
    page?: "number, page number (default: 1)",
    limit?: "number, items per page (default: 20)"
  }
}
```

#### Output
```typescript
{
  items: [
    {
      name: "string, business name", 
      businessType: "string, business category",
      location: "string, business location",
      isActive: "boolean, active status",
      timestamp: "number, unix timestamp of last update",
      _: { soul: "string, unique identifier generated by GunDB" }
    }
  ],
  total: "number, total count of businesses matching criteria",
  page: "number, current page",
  limit: "number, items per page",
  hasMore: "boolean, whether there are more pages"
}
```

