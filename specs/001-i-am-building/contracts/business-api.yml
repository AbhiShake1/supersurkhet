### useCreate (Add a new offering to a business)

#### Input
```typescript
{
  schema: "product",  // Could also be 'menuItem', 'service', etc. based on business type
  data: {
    title: "string, required, name of the offering",
    description: "string, optional, detailed description",
    price: "number, required, positive price with coercion",
    category: "string, optional, category (default: 'Others')",
    tags: "record, optional, tags for the offering",
    imageUrl: "string, optional, URL to image",
    isFeatured: "boolean, optional, whether it's featured",
    isActive: "boolean, optional, default: true",
    businessId: "reference, required, reference to the business"
  }
}
```

#### Output
```typescript
{
  title: "string, offering name",
  description: "string, offering description", 
  price: "number, offering price",
  category: "string, offering category",
  tags: "record, offering tags",
  imageUrl: "string, image URL",
  isFeatured: "boolean, featured status",
  isActive: "boolean, active status",
  businessId: "reference, reference to business",
  created_by: "string, user ID of creator",
  timestamp: "number, unix timestamp of creation",
  _: { soul: "string, unique identifier generated by GunDB" }
}
```

