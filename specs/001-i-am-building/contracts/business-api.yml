## Error Handling
All data interactions follow this general error structure:

- Validation errors: Emitted when schema validation fails
- Connection errors: Emitted when GunDB connection is unavailable
- Permission errors: Emitted when user lacks required permissions

### Common Error Format
```typescript
{
  error: "string, general error message",
  code: "string, specific error code (e.g., 'VALIDATION_ERROR', 'CONNECTION_ERROR', 'PERMISSION_DENIED')",
  details: "object, additional error information when applicable"
}
```

## GunDB Integration Notes
- All data is stored in GunDB's decentralized, peer-to-peer network
- Real-time synchronization happens automatically across all peers
- No need for manual cache invalidation - updates are instantly reflected
- Offline capabilities available - data persists locally and syncs when connection is restored
- Each schema corresponds directly to a data model defined in @apps/site/src/lib/schema.ts
- CRUD operations are abstracted through useCreate, useGet, useUpdate, useDelete hooks