# Data Contract: Business Management (Schema-Driven with GunDB)

## Overview
This document defines the data contract for business management operations in the SuperSurkhet platform using GunDB and schema-driven hooks. Instead of traditional REST APIs, the platform uses auto-generated hooks based on Zod schemas from `@/lib/schema.ts` and `@/lib/schemas/**`.

## Data Access Pattern
All data operations are performed through auto-generated TanStack Query hooks that interact directly with GunDB:

### Auto-Generated Hooks from api object
Based on the implementation in `apps/site/src/lib/api.ts`, the `api` object provides these hooks:
- `api[schemaName].useGet()` - Retrieve data based on schema
- `api[schemaName].useCreate()` - Create new records based on schema
- `api[schemaName].useUpdate()` - Update existing records based on schema
- `api[schemaName].useDelete()` - Delete records based on schema

## Business Schema Contract

### Business Entity
Based on `businessSchema` from `@/lib/schema.ts`:

```typescript
{
  id: string (auto-generated by GunDB as soul),
  name: string (required, official business name),
  location: string (optional, physical address or area),
  basePath: string (optional, unique URL path like /my-shop),
  features: Record<string, boolean> (optional, map of enabled features),
  isActive: boolean (default: true, whether business is active),
  created_by?: string (user ID of creator),
  timestamp?: number (unix timestamp of last update),
  _: { soul?: string } (GunDB internal reference)
}
```

## Operations Using Schema-Driven Hooks

### 1. Create Business
**Hook:** `api.business.useCreate()`

#### Parameters:
```typescript
{
  // Options for mutation
  opts?: {
    keys?: string[],  // Additional cache keys for invalidation
    onSuccess?: (data: Business) => void,  // Callback after successful creation
    onError?: (error: Error) => void,  // Callback after failed creation
  }
}
```

#### Input (using businessSchema validation):
```typescript
{
  name: string (required),
  location?: string,
  basePath?: string,
  features?: Record<string, boolean>,
  isActive?: boolean
}
```

#### Usage Example:
```typescript
const createBusinessMutation = api.business.useCreate({
  keys: ["business"],
  onSuccess: (newBusiness) => {
    console.log("Business created:", newBusiness);
  }
});

// To create a business
createBusinessMutation.mutate({
  name: "My Restaurant",
  location: "Surkhet Valley"
});
```

### 2. Get Business Details
**Hook:** `api.business.useGet()`

#### Parameters:
```typescript
{
  opts?: {
    keys: [schemaName: string, slug: string],  // Cache key with schema and business identifier
  }
}
```

#### Usage Example:
```typescript
// From restaurant example in codebase
const { data: _menuItems = [], isLoading } = api.menuItem.useGet({
  keys: ["restaurant"],
});

// For business details
const { data: business, isLoading } = api.business.useGet({
  keys: ["business", "my-restaurant"]
});
```

#### Returns:
```typescript
{
  data?: Business[],  // Array of business entities
  isLoading: boolean,
  isError: boolean,
  error?: Error
}
```

### 3. Update Business
**Hook:** `api.business.useUpdate()`

#### Parameters:
```typescript
{
  opts?: {
    keys?: string[],  // Additional cache keys for invalidation
    onSuccess?: (data: Business) => void,  // Callback after successful update
    onError?: (error: Error) => void,  // Callback after failed update
  }
}
```

#### Input:
```typescript
{
  id: string (GunDB soul - required for update),
  name?: string,
  location?: string,
  basePath?: string,
  features?: Record<string, boolean>,
  isActive?: boolean
}
```

#### Usage Example:
```typescript
const updateBusinessMutation = api.business.useUpdate({
  keys: ["business"],
  onSuccess: (updatedBusiness) => {
    console.log("Business updated:", updatedBusiness);
  }
});

// To update a business
updateBusinessMutation.mutate({
  id: "business-soul-123",
  name: "Updated Business Name"
});
```

### 4. Delete Business
**Hook:** `api.business.useDelete()`

#### Parameters:
```typescript
{
  opts?: {
    keys?: string[],  // Additional cache keys for invalidation
    onSuccess?: (data: string) => void,  // Callback after successful deletion
    onError?: (error: Error) => void,  // Callback after failed deletion
  }
}
```

#### Input:
```typescript
{
  id: string (GunDB soul - identifier for the business to delete)
}
```

#### Usage Example:
```typescript
const deleteBusinessMutation = api.business.useDelete({
  keys: ["business"],
  onSuccess: (id) => {
    console.log("Business deleted:", id);
  }
});

// To delete a business
deleteBusinessMutation.mutate("business-soul-123");
```

## Additional Schema Contracts

### MenuItem Entity (example from restaurant implementation)
Based on `menuItemSchema` from `@/lib/schemas/listings.ts`:

#### Operations:
- `api.menuItem.useGet({ keys: [slug] })` - Get menu items for a restaurant
- `api.menuItem.useCreate()` - Add new menu item 
- `api.menuItem.useUpdate()` - Update menu item
- `api.menuItem.useDelete()` - Remove menu item

#### Usage in Restaurant Client Page:
```typescript
const { data: _menuItems = [], isLoading } = api.menuItem.useGet({
  keys: [slug],  // slug is the restaurant identifier
});
```

### Order Entity (example from cart implementation)
Based on the cart example in restaurant page:

#### Create Order Operation:
```typescript
const createOrderMutation = api.order.useCreate({
  keys: ["restaurant"],  // Context identifier
  onSuccess() {
    clearCart();  // Clear cart after successful order creation
  },
});

// Usage when checking out
createOrderMutation.mutate({
  items: orderItems,
  subTotal: subtotal,
  taxes: subtotal * 0.13,
  deliveryFee: 0,
  totalAmount: subtotal * 1.13,
  orderStatus: "pending",
  paymentMethod: "cash",
  paymentStatus: "paid",
});
```

## Other Schema Operations
Based on various implementations throughout the codebase, similar patterns apply to other schemas:
- `api.user` - User management operations
- `api.membership` - Business membership operations
- `api.role` - Role and permission operations
- `api.transaction` - Transaction operations
- `api.notification` - Notification operations

## Auto-Admin Implementation
The AutoAdmin component uses these hooks internally to provide:
- Automatic CRUD operations for all schema types
- Dynamic form generation based on schema validation
- Real-time data synchronization through GunDB
- Context-aware operations based on user permissions

## Authentication & Authorization
- Authentication handled through GunDB user system
- Authorization via role-based permissions stored in GunDB
- Context-based access control (business-specific permissions)
- All hooks respect user's authentication context and business permissions

## Data Consistency
- GunDB provides eventual consistency across peers
- Real-time synchronization without manual query invalidation
- Offline-first approach with automatic sync when connectivity restored

## Error Handling
All hooks follow standard TanStack Query error patterns:
- `error: { message: string, code: string, details?: object }`
- Validation errors from Zod schemas
- Network errors handled automatically by GunDB
- Loading states provided for all async operations
