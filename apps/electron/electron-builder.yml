appId: com.supersurkhet.desktop
productName: SuperSurkhet
compression: maximum
electronLanguages:
  - en-US
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - assets/**/*
publish:
  provider: github
  owner: AbhiShake1
  repo: supersurkhet

win:
  artifactName: SuperSurkhet-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

appx:
  applicationId: SuperSurkhet
  displayName: SuperSurkhet
  publisherDisplayName: SuperSurkhet
  identityName: com.supersurkhet.desktop

mac:
  artifactName: SuperSurkhet-macos-${arch}.${ext}
  identity: null
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

mas:
  category: public.app-category.utilities

linux:
  artifactName: SuperSurkhet-linux-${arch}.${ext}
  maintainer: SuperSurkhet Team <dev@surkhet.app>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: snap
      arch:
        - x64
  category: Utility
