name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists for this tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  build-and-upload:
    name: Build & Upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd apps/electron
          pnpm run build -- --win nsis --publish never

      - name: Build macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd apps/electron
          if [[ -z "${CSC_LINK:-}" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run build -- --mac dmg zip --publish never

      - name: Build Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd apps/electron
          pnpm run build -- --linux AppImage deb --publish never

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/electron/release/SuperSurkhet-windows-x64-setup.exe
            apps/electron/release/SuperSurkhet-windows-x64-setup.exe.blockmap
            apps/electron/release/latest.yml

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/electron/release/SuperSurkhet-macos-arm64.dmg
            apps/electron/release/SuperSurkhet-macos-x64.dmg
            apps/electron/release/SuperSurkhet-macos-arm64.zip
            apps/electron/release/SuperSurkhet-macos-x64.zip
            apps/electron/release/latest-mac.yml

      - name: Upload Linux release assets
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/electron/release/SuperSurkhet-linux-x64.AppImage
            apps/electron/release/SuperSurkhet-linux-x64.deb

      - name: Build Microsoft Store package (appx)
        if: matrix.os == 'windows-latest' && env.WIN_CSC_LINK != ''
        shell: bash
        run: |
          cd apps/electron
          pnpm exec electron-builder --win appx --publish never

      - name: Build Mac App Store package (mas)
        if: matrix.os == 'macos-latest' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          cd apps/electron
          pnpm exec electron-builder --mac mas --publish never

      - name: Upload store packages
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-store-packages-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            apps/electron/release/*.appx
            apps/electron/release/*.msix
            apps/electron/release/*.pkg
          if-no-files-found: ignore
