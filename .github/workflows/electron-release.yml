name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists for this tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  build-and-upload:
    name: Build & Upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd apps/electron
          pnpm exec tsc
          CSC_IDENTITY_AUTO_DISCOVERY=false WIN_CSC_LINK= WIN_CSC_KEY_PASSWORD= pnpm exec electron-builder --win nsis --publish never

      - name: Build macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd apps/electron
          pnpm exec tsc
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac dmg zip --publish never

      - name: Build Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd apps/electron
          pnpm exec tsc
          pnpm exec electron-builder --linux AppImage deb --publish never

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/electron/release/SuperSurkhet-windows-x64-setup.exe
            apps/electron/release/SuperSurkhet-windows-x64-setup.exe.blockmap
            apps/electron/release/latest.yml

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/electron/release/SuperSurkhet-macos-arm64.dmg
            apps/electron/release/SuperSurkhet-macos-x64.dmg
            apps/electron/release/SuperSurkhet-macos-arm64.zip
            apps/electron/release/SuperSurkhet-macos-x64.zip
            apps/electron/release/latest-mac.yml

      - name: Upload Linux release assets
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            apps/electron/release/SuperSurkhet-linux-x64.AppImage
            apps/electron/release/SuperSurkhet-linux-x64.deb
