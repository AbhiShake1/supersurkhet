name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
      - "v*"

permissions:
  contents: write

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      current_version: ${{ steps.version.outputs.current_version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect desktop version change
        id: version
        shell: bash
        run: |
          result="$(./scripts/ci/check-version-bump.sh apps/electron/package.json)"
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: detect-version-bump
    if: |
      needs.detect-version-bump.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish desktop artifacts
        shell: bash
        run: |
          cd apps/electron
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pnpm run build -- --win nsis --publish always
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            if [[ -z "${CSC_LINK:-}" ]]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
            pnpm run build -- --mac dmg zip --publish always
          else
            pnpm run build -- --linux AppImage deb rpm snap --publish always
          fi

      - name: Build Microsoft Store package (appx)
        if: matrix.os == 'windows-latest' && env.WIN_CSC_LINK != ''
        shell: bash
        run: |
          cd apps/electron
          pnpm exec electron-builder --win appx --publish never

      - name: Build Mac App Store package (mas)
        if: matrix.os == 'macos-latest' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          cd apps/electron
          pnpm exec electron-builder --mac mas --publish never

      - name: Upload store packages
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-store-packages-${{ matrix.os }}-${{ needs.detect-version-bump.outputs.current_version }}
          path: |
            apps/electron/release/*.appx
            apps/electron/release/*.msix
            apps/electron/release/*.pkg
          if-no-files-found: ignore

  no-release:
    runs-on: ubuntu-latest
    needs: detect-version-bump
    if: |
      needs.detect-version-bump.outputs.version_changed != 'true'
    steps:
      - name: Skip release
        run: |
          echo "Skipping desktop release. Version unchanged in apps/electron/package.json"
          echo "Current: ${{ needs.detect-version-bump.outputs.current_version }}"
          echo "Previous: ${{ needs.detect-version-bump.outputs.previous_version }}"
