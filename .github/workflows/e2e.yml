name: E2E (Playwright)

on:
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter supersurkhet exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm --filter supersurkhet test:e2e
