name: Mobile Release (Expo)

on:
  push:
    tags:
      - "surkhet-v*"

permissions:
  contents: write

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      current_version: ${{ steps.version.outputs.current_version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect app version change
        id: version
        shell: bash
        run: |
          result="$(./scripts/ci/check-version-bump.sh apps/surkhet/package.json)"
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  build-and-submit:
    runs-on: ubuntu-latest
    needs: detect-version-bump
    if: |
      needs.detect-version-bump.outputs.version_changed == 'true'
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
      EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo auth token
        id: validate_mobile_secrets
        shell: bash
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "can_release=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is missing. Skipping mobile store build/submit."
            exit 0
          fi
          if [[ -z "${EXPO_APPLE_ID:-}" || -z "${EXPO_ASC_APP_ID:-}" || -z "${EXPO_APPLE_TEAM_ID:-}" ]]; then
            echo "can_release=false" >> "$GITHUB_OUTPUT"
            echo "Missing iOS submit secrets. Skipping mobile store build/submit."
            exit 0
          fi
          echo "can_release=true" >> "$GITHUB_OUTPUT"

      - name: Setup Expo and EAS CLI
        if: steps.validate_mobile_secrets.outputs.can_release == 'true'
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      - name: Materialize Play Store service account key
        if: steps.validate_mobile_secrets.outputs.can_release == 'true'
        shell: bash
        env:
          EXPO_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.EXPO_GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          mkdir -p apps/surkhet/.secrets
          if [[ -z "${EXPO_GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]]; then
            echo "EXPO_GOOGLE_SERVICE_ACCOUNT_KEY is missing. Skipping mobile store build/submit."
            exit 0
          fi
          printf '%s' "$EXPO_GOOGLE_SERVICE_ACCOUNT_KEY" > apps/surkhet/.secrets/google-service-account.json

      - name: Show release version
        if: steps.validate_mobile_secrets.outputs.can_release == 'true'
        run: |
          echo "Releasing mobile version: ${{ needs.detect-version-bump.outputs.current_version }}"

      - name: Build and submit Android
        if: steps.validate_mobile_secrets.outputs.can_release == 'true'
        working-directory: apps/surkhet
        run: pnpm dlx eas-cli build --platform android --profile production --non-interactive --auto-submit

      - name: Build and submit iOS
        if: steps.validate_mobile_secrets.outputs.can_release == 'true'
        working-directory: apps/surkhet
        run: pnpm dlx eas-cli build --platform ios --profile production --non-interactive --auto-submit

  no-release:
    runs-on: ubuntu-latest
    needs: detect-version-bump
    if: |
      needs.detect-version-bump.outputs.version_changed != 'true'
    steps:
      - name: Skip release
        run: |
          echo "Skipping mobile release. Version unchanged in apps/surkhet/package.json"
          echo "Current: ${{ needs.detect-version-bump.outputs.current_version }}"
          echo "Previous: ${{ needs.detect-version-bump.outputs.previous_version }}"

  build-android-apk-for-github-release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo auth token
        id: validate_apk_token
        shell: bash
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "can_build=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is missing. Skipping APK release upload."
            exit 0
          fi
          echo "can_build=true" >> "$GITHUB_OUTPUT"

      - name: Setup Expo and EAS CLI
        if: steps.validate_apk_token.outputs.can_build == 'true'
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      - name: Build Android APK (preview profile)
        if: steps.validate_apk_token.outputs.can_build == 'true'
        working-directory: apps/surkhet
        run: |
          pnpm dlx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-android-build.json

      - name: Download APK artifact from EAS
        if: steps.validate_apk_token.outputs.can_build == 'true'
        shell: bash
        run: |
          mkdir -p apps/surkhet/release
          APK_URL=$(node -e "const fs=require('fs');const payload=JSON.parse(fs.readFileSync('apps/surkhet/eas-android-build.json','utf8'));const build=Array.isArray(payload)?payload[0]:payload;const url=build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || ''; if(!url){console.error('No Android APK URL found in EAS build output'); process.exit(1);} console.log(url);")
          echo "Downloading APK from: $APK_URL"
          curl -L \"$APK_URL\" -o apps/surkhet/release/SuperSurkhet-android.apk

      - name: Upload Android APK to GitHub Release
        if: steps.validate_apk_token.outputs.can_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            apps/surkhet/release/SuperSurkhet-android.apk
