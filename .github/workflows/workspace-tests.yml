name: Workspace Tests

on:
  pull_request:
    paths:
      - "apps/surkhet/**"
      - ".github/workflows/workspace-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/surkhet/**"
      - ".github/workflows/workspace-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace parser tests
        run: pnpm run test:workspace
